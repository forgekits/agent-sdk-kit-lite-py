[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-sdk-kit-lite"
version = "0.1.0"
description = "A small, tested starting point for building agents on the Claude Agent SDK (Python)."
readme = "README.md"
license = "MIT"
authors = [{ name = "forgekits" }]
requires-python = ">=3.10"
dependencies = [
  "claude-agent-sdk>=0.2.185",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "mypy>=1.13",
  "ruff>=0.7",
]

[project.urls]
Homepage = "https://github.com/forgekits/agent-sdk-kit-lite-py"
Issues = "https://github.com/forgekits/agent-sdk-kit-lite-py/issues"

[project.scripts]
agent-kit = "agent_kit_lite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["agent_kit_lite"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["agent_kit_lite", "tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
